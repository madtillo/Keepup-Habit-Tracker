<!doctype html>
<html lang="de" data-theme="dark" data-accent="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Keepup" />
    <meta name="description" content="Keepup – Habits, Todos, Stimmung & Fokus" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iOS-Startbild: schwarz wie die Start-Animation -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1260x2736.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/splash-750x1334.png" />
    <title>Keepup</title>
    <script>
      // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
      try {
        var s = JSON.parse(localStorage.getItem('keepup:v1') || '{}').settings
        s = s && s.settings
        if (s) {
          var t = s.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : s.theme
          if (t) document.documentElement.dataset.theme = t
          if (s.accent) document.documentElement.dataset.accent = s.accent
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Start-Animation: nur beim Öffnen vom Home-Bildschirm, ca. 1,7 s, Tippen überspringt -->
    <style>
      #splash{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;overflow:hidden;transition:opacity .4s ease}
      #splash.out{opacity:0;pointer-events:none}
      #splash .sp-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.13),rgba(255,255,255,0) 50%);animation:spFade 1s ease both}
      #splash .sp-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:-30px}
      #splash .sp-tile{width:150px;height:150px;border-radius:36px;background:linear-gradient(180deg,#34353a,#0a0a0b);border:1px solid rgba(255,255,255,.1);
        box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
        animation:spIn .7s cubic-bezier(.2,.9,.25,1.15) both,spLift .55s 1.05s ease-in-out both}
      #splash svg{width:100%;height:100%}
      #splash .sp-track{fill:none;stroke:rgba(255,255,255,.16);stroke-width:30}
      #splash .sp-ring{fill:none;stroke:#fff;stroke-width:30;stroke-linecap:round;stroke-dasharray:660;stroke-dashoffset:660;animation:spDraw .6s .3s cubic-bezier(.5,0,.2,1) forwards}
      #splash .sp-check{fill:none;stroke:#fff;stroke-width:34;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:210;stroke-dashoffset:210;animation:spDraw .35s .78s cubic-bezier(.3,0,.2,1) forwards}
      #splash .sp-name{font:800 38px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.8px;color:#f5f5f7;animation:spUp .5s .5s ease-out both}
      @keyframes spIn{from{opacity:0;transform:translateY(50px) scale(.5) rotate(-18deg)}to{opacity:1;transform:none}}
      @keyframes spLift{0%,100%{transform:none}45%{transform:translateY(-16px) rotate(-4deg) scale(1.05)}}
      @keyframes spDraw{to{stroke-dashoffset:0}}
      @keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes spFade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:spFade .3s ease both!important;stroke-dashoffset:0!important}}
    </style>
    <div id="splash" aria-hidden="true">
      <div class="sp-glow"></div>
      <div class="sp-wrap">
        <div class="sp-tile">
          <svg viewBox="0 0 512 512">
            <circle class="sp-track" cx="256" cy="256" r="150" />
            <path class="sp-ring" d="M256 106 A150 150 0 1 1 116 310" />
            <path class="sp-check" d="M190 262 l46 46 l92 -104" />
          </svg>
        </div>
        <div class="sp-name">Keepup</div>
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('splash')
        var sa = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
        if (!sa) { s.parentNode.removeChild(s); return }
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var done = false
        function end() {
          if (done) return
          done = true
          s.className = 'out'
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s) }, 450)
        }
        s.addEventListener('click', end)
        s.addEventListener('touchstart', end, { passive: true })
        setTimeout(end, reduce ? 700 : 1750)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
