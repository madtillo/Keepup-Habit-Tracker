<!doctype html>
<html lang="de" data-theme="dark" data-accent="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Keepup" />
    <meta name="description" content="Keepup – Habits, Todos, Stimmung & Fokus" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Keepup</title>
    <script>
      // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
      try {
        var s = JSON.parse(localStorage.getItem('keepup:v1') || '{}').settings
        s = s && s.settings
        if (s) {
          var t = s.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : s.theme
          if (t) document.documentElement.dataset.theme = t
          if (s.accent) document.documentElement.dataset.accent = s.accent
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
